<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Audio Transcriber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow border-b sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-8 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 text-white rounded-2xl flex items-center justify-center font-bold text-xl">G</div>
                <h1 class="text-3xl font-semibold tracking-tight">Grok Transcriber</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="showLoginModal()" class="px-6 py-2.5 text-indigo-600 hover:bg-indigo-50 rounded-2xl font-medium">Login</button>
                <button onclick="showRegisterModal()" class="px-6 py-2.5 bg-indigo-600 text-white rounded-2xl font-medium hover:bg-indigo-700">Register</button>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-8">
        <!-- Recording -->
        <div class="bg-white rounded-3xl shadow-xl p-12 text-center mb-10">
            <button id="recordBtn" onclick="toggleRecording()" 
                    class="w-40 h-40 rounded-full bg-red-500 hover:bg-red-600 text-white text-7xl shadow-2xl mx-auto flex items-center justify-center">
                🎤
            </button>
            <p id="status" class="mt-8 text-xl font-medium text-gray-500">Ready — click to record (max 60s)</p>
            <p id="timer" class="font-mono text-5xl text-gray-300 mt-3">00:00</p>
        </div>

        <!-- Latest Transcript with Clickable Segments -->
        <div id="transcriptCard" class="hidden bg-white rounded-3xl shadow-xl p-8 mb-10">
            <h3 class="text-2xl font-semibold mb-6">Latest Transcription</h3>
            <audio id="audioPlayer" class="w-full mb-6" controls></audio>
            <div id="diarizedTranscript" class="prose text-lg leading-relaxed max-h-[500px] overflow-auto p-6 bg-gray-50 rounded-2xl transcript-container"></div>
        </div>

        <!-- History -->
        <div>
            <h3 class="font-semibold text-xl mb-6">Your Recordings <span id="historyCount" class="text-sm font-normal text-gray-500"></span></h3>
            <div id="history" class="grid gap-4"></div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-10 w-full max-w-md">
            <div class="flex justify-between mb-8">
                <h3 id="modalTitle" class="text-3xl font-bold">Sign In</h3>
                <button onclick="closeModal()" class="text-4xl text-gray-400 hover:text-gray-600">×</button>
            </div>
            <div id="loginForm">
                <input id="loginEmail" type="email" placeholder="Email" class="w-full border rounded-2xl px-5 py-4 mb-4">
                <input id="loginPass" type="password" placeholder="Password" class="w-full border rounded-2xl px-5 py-4 mb-8">
                <button onclick="loginUser()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-semibold">Sign In</button>
            </div>
            <div id="registerForm" class="hidden">
                <input id="regName" placeholder="Full Name" class="w-full border rounded-2xl px-5 py-4 mb-4">
                <input id="regEmail" type="email" placeholder="Email" class="w-full border rounded-2xl px-5 py-4 mb-4">
                <input id="regPass" type="password" placeholder="Password" class="w-full border rounded-2xl px-5 py-4 mb-8">
                <button onclick="registerUser()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-semibold">Create Account</button>
            </div>
            <p id="authMessage" class="text-red-500 text-center mt-4 hidden"></p>
        </div>
    </div>

    <script>
        let mediaRecorder, audioChunks = [], currentToken = null, currentAudioUrl = null, currentRecordingId = null;
        let timerInterval, seconds = 0, isRecording = false;
        let currentAudio = null; // For sentence playback

        // Tailwind script init
        function initTailwind() {
            // Already loaded via CDN
        }

        // === Auth Functions ===
        function showLoginModal() {
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = 'Sign In';
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('authMessage').classList.add('hidden');
        }

        function showRegisterModal() {
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = 'Create Account';
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('authMessage').classList.add('hidden');
        }

        function closeModal() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('authMessage').classList.add('hidden');
        }

        async function loginUser() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;
            const messageEl = document.getElementById('authMessage');

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username: email, password: password })
                });

                if (res.ok) {
                    const data = await res.json();
                    currentToken = data.access_token;
                    localStorage.setItem('token', currentToken);
                    closeModal();
                    document.getElementById('status').textContent = 'Logged in! Ready to record.';
                    loadHistory();
                } else {
                    const err = await res.json();
                    messageEl.textContent = err.detail || 'Login failed';
                    messageEl.classList.remove('hidden');
                }
            } catch (err) {
                messageEl.textContent = 'Connection error';
                messageEl.classList.remove('hidden');
            }
        }

        async function registerUser() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;
            const messageEl = document.getElementById('authMessage');

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, full_name: name })
                });

                if (res.ok) {
                    const data = await res.json();
                    currentToken = data.access_token;
                    localStorage.setItem('token', currentToken);
                    closeModal();
                    document.getElementById('status').textContent = 'Account created! Ready to record.';
                    loadHistory();
                } else {
                    const err = await res.json();
                    messageEl.textContent = err.detail || 'Registration failed';
                    messageEl.classList.remove('hidden');
                }
            } catch (err) {
                messageEl.textContent = 'Connection error';
                messageEl.classList.remove('hidden');
            }
        }

        // Load token on page load
        window.onload = function() {
            const savedToken = localStorage.getItem('token');
            if (savedToken) {
                currentToken = savedToken;
                loadHistory();
            }
            initTailwind();
        };

        // === Recording & Timer ===
        async function toggleRecording() {
            if (!currentToken) {
                alert("Please log in first");
                showLoginModal();
                return;
            }

            const recordBtn = document.getElementById("recordBtn");
            const status = document.getElementById("status");
            const timerEl = document.getElementById("timer");

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        uploadAudio(blob);
                    };
                    
                    mediaRecorder.start(1000); // chunks every second for better handling
                    isRecording = true;
                    recordBtn.classList.add("recording");
                    status.textContent = "🔴 Recording... (max ~60s recommended)";
                    seconds = 0;
                    timerEl.classList.add('text-red-500');
                    startTimer();
                } catch (err) {
                    console.error(err);
                    alert("Microphone access denied or not available.");
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                recordBtn.classList.remove("recording");
                status.textContent = "Processing with Grok STT...";
                stopTimer();
                timerEl.classList.remove('text-red-500');
            }
        }

        function startTimer() {
            const timerEl = document.getElementById("timer");
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const min = Math.floor(seconds / 60).toString().padStart(2, '0');
                const sec = (seconds % 60).toString().padStart(2, '0');
                timerEl.textContent = `${min}:${sec}`;
                if (seconds >= 90) { // safety
                    toggleRecording();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById("timer").textContent = "00:00";
        }

        // === Upload and Display ===
        async function uploadAudio(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recording.webm");

            const status = document.getElementById("status");
            status.textContent = "Uploading and transcribing with Grok STT...";

            try {
                const res = await fetch("/recordings/upload", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${currentToken}` },
                    body: formData
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || 'Upload failed');
                }

                const data = await res.json();

                // Save for history playback
                currentRecordingId = data.id;
                currentAudioUrl = URL.createObjectURL(blob);

                // Display transcript with colored speaker segments
                const transcriptDiv = document.getElementById("diarizedTranscript");
                transcriptDiv.innerHTML = data.diarized_html || data.transcript || "Transcription complete. No words detected.";
                
                // Make segments clickable for sentence playback
                makeTranscriptClickable(transcriptDiv, currentAudioUrl, data.id);

                document.getElementById("transcriptCard").classList.remove("hidden");
                const player = document.getElementById("audioPlayer");
                player.src = currentAudioUrl;
                player.load();

                status.textContent = "✅ Transcription complete! Click colored segments to play that speaker turn.";
                loadHistory();
            } catch (err) {
                console.error(err);
                status.textContent = "❌ Error: " + err.message;
                alert("Failed to process recording: " + err.message);
            }
        }

        function makeTranscriptClickable(container, audioSrc, recordingId) {
            // Parse the HTML spans and add click handlers for sentence playback
            const segments = container.querySelectorAll('span[style*="color"]'); // rough but works for our spans
            if (segments.length === 0) {
                // Fallback - split by <br> or make whole transcript clickable
                container.style.cursor = 'pointer';
                container.onclick = () => playFullAudio(audioSrc);
                return;
            }

            segments.forEach((segment, index) => {
                segment.style.cursor = 'pointer';
                segment.title = 'Click to play this speaker turn';
                segment.onclick = async (e) => {
                    e.stopImmediatePropagation();
                    await playSegment(segment, audioSrc, recordingId, index);
                };
            });
        }

        async function playSegment(segmentEl, audioSrc, recordingId, index) {
            // Highlight
            document.querySelectorAll('.transcript-segment, span[style*="color"]').forEach(el => {
                el.classList.remove('playing', 'bg-blue-100');
            });
            segmentEl.classList.add('playing', 'bg-blue-100');

            const audio = new Audio(audioSrc);
            audio.play().catch(e => console.error('Playback error', e));
            
            // Auto stop highlight after ~5s or on end
            setTimeout(() => {
                segmentEl.classList.remove('playing', 'bg-blue-100');
            }, 8000);
        }

        function playFullAudio(audioSrc) {
            const audio = new Audio(audioSrc);
            audio.play();
        }

        // === History ===
        async function loadHistory() {
            if (!currentToken) return;
            
            try {
                const res = await fetch("/recordings/", {
                    headers: { "Authorization": `Bearer ${currentToken}` }
                });
                
                if (!res.ok) throw new Error('Failed to load history');
                
                const recordings = await res.json();
                document.getElementById("historyCount").textContent = `(${recordings.length})`;
                
                const historyHTML = recordings.map(r => `
                    <div onclick="playRecording(${r.id});" class="recording-card bg-white p-6 rounded-3xl shadow hover:shadow-xl cursor-pointer border border-gray-100 flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-lg">🎙️</div>
                                <div>
                                    <p class="font-semibold text-lg text-gray-800">${r.filename.split('_').slice(2).join('_') || 'Recording'}</p>
                                    <p class="text-xs text-gray-500">${new Date(r.created_at).toLocaleString()}</p>
                                </div>
                            </div>
                            <div class="mt-4 text-sm text-gray-600 line-clamp-2 max-h-12 overflow-hidden">
                                ${r.transcript ? r.transcript.substring(0, 120) + '...' : 'No transcript yet'}
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs font-mono rounded-2xl">${r.duration || '?'}s</span>
                            <button onclick="deleteRecording(${r.id}); event.stopImmediatePropagation()" 
                                    class="px-4 py-1.5 text-red-500 hover:bg-red-50 rounded-2xl text-sm font-medium">Delete</button>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById("history").innerHTML = historyHTML || '<p class="text-gray-400 italic p-8 text-center">No recordings yet. Record something above!</p>';
            } catch (e) {
                console.error(e);
                document.getElementById("history").innerHTML = '<p class="text-red-400 p-4">Could not load history.</p>';
            }
        }

        async function playRecording(id) {
            if (!currentToken) return;
            
            try {
                const res = await fetch(`/recordings/${id}`, {
                    headers: { "Authorization": `Bearer ${currentToken}` }
                });
                const data = await res.json();
                
                currentRecordingId = id;
                currentAudioUrl = `/recordings/audio/${id}`;
                
                document.getElementById("diarizedTranscript").innerHTML = data.diarized_html || data.transcript || "No transcript";
                makeTranscriptClickable(document.getElementById("diarizedTranscript"), currentAudioUrl, id);
                
                const player = document.getElementById("audioPlayer");
                player.src = currentAudioUrl;
                player.load();
                
                document.getElementById("transcriptCard").classList.remove("hidden");
                document.getElementById("status").textContent = "Playing from history. Click segments to replay turns.";
            } catch (err) {
                console.error(err);
                alert("Could not load recording: " + err.message);
            }
        }

        async function deleteRecording(id) {
            if (!confirm("Delete this recording and transcript permanently?")) return;
            
            try {
                const res = await fetch(`/recordings/${id}`, { 
                    method: "DELETE", 
                    headers: { "Authorization": `Bearer ${currentToken}` } 
                });
                if (res.ok) {
                    loadHistory();
                    // Clear current view if it was the deleted one
                    if (currentRecordingId === id) {
                        document.getElementById("transcriptCard").classList.add("hidden");
                    }
                }
            } catch (err) {
                alert("Delete failed: " + err.message);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' && !isRecording && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
                toggleRecording();
            }
            if (e.key === 'Escape') {
                const modal = document.getElementById('authModal');
                if (!modal.classList.contains('hidden')) closeModal();
            }
        });
    </script>
</body>
</html>
